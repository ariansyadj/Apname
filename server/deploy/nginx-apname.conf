# Site Nginx untuk Apname di VPS.
# Dipasang oleh skrip deploy ke /etc/nginx/sites-available/apname.
# GANTI server_name _ dengan domain .CLOUD setelah domain diarahkan
# (lalu jalankan Certbot untuk HTTPS — lihat DEPLOY-VPS.md).
server {
    listen 80;
    server_name _;

    # Frontend statis (build Vite)
    root /opt/apname/app;
    index index.html;

    # API + WebSocket ke backend Node (port 4000)
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
    }
    location /ws {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # SPA fallback: semua rute lain ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
