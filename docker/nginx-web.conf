# Nginx di dalam container web Apname (Docker).
# Melayani frontend statis + proxy /api dan /ws ke service backend.
# JANGAN ganti backend:4000 — itu nama service di docker-compose.yml.
# Akses publik + HTTPS diatur di Nginx host (docker/nginx-host.conf),
# bukan di container ini.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
    }

    location /ws {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # SPA fallback: semua rute lain ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
