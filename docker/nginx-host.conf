# Nginx HOST (di VPS, di luar Docker) untuk Apname Docker.
# CARA PAKAI: ganti DOMAIN_ANDA, salin ke
# /etc/nginx/sites-available/apname-docker, symlink ke sites-enabled/,
# lalu: nginx -t && systemctl reload nginx
# HTTPS dipasang SETELAH file ini aktif, dengan Certbot.
# Container web hanya mendengarkan di 127.0.0.1:8080 (lihat compose).

server {
    listen 80;
    server_name DOMAIN_ANDA;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
